version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskdb
    volumes:
      - mysql-data:/var/lib/mysql
      # Automatically initialize database with the SQL script on container startup
      - ./src/main/resources/db/taskdb.sql:/docker-entrypoint-initdb.d/taskdb.sql
    networks:
      - task-network
    restart: always

  task-app:
    build: .
    container_name: task-app
    ports:
      - "8080:8080"
    depends_on:
      - mysql-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/taskdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - task-network
    restart: always

volumes:
  mysql-data:

networks:
  task-network:
    driver: bridge
